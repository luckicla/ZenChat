<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data: blob:; media-src * data: blob:; connect-src *; frame-src http://127.0.0.1:47830">
<title>ZenChat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bungee&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,900&family=Rubik+Mono+One&family=Space+Mono:wght@400;700&family=Special+Elite&family=UnifrakturMaguntia&family=Silkscreen&family=Righteous&family=Bebas+Neue&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" id="bg"><img id="bgImg" alt=""></div>

<header class="tbar" id="tbar">
  <h1 class="logo" aria-label="ZenChat"><span class="l1">Z</span><span class="l2">E</span><span class="l3">N</span><span class="l4">C</span><span class="l5">H</span><span class="l6">A</span><span class="l1">T</span></h1>
  <nav class="tabs" id="tabs" aria-label="Pestañas"></nav>
  <button class="tb-b" id="tabAdd" title="Nueva pestaña (Ctrl+T)" aria-label="Nueva pestaña"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></button>
  <i class="tb-sp"></i>
  <div class="live" id="live" hidden><i></i><span id="liveTxt">EN DIRECTO</span></div>
  <div class="views" id="views">
    <button data-view="chat" class="sel" title="Chat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chat</span></button>
    <button data-view="alerts" title="Alertas"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span>Alertas</span></button>
    <button data-view="overlays" title="Overlays de OBS"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="13"/><path d="M8 21h8M12 18v3"/></svg><span>OBS</span></button>
    <button data-view="settings" title="Ajustes"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Ajustes</span></button>
  </div>
  <button class="tb-b" id="actBtn" title="Actividad (Ctrl+E)" aria-label="Actividad"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></button>
  <div class="tb-w">
    <button class="tb-c" id="wPin" title="Siempre encima" aria-label="Siempre encima"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg></button>
    <button class="tb-c" id="wMin" title="Minimizar" aria-label="Minimizar"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="tb-c" id="wMax" title="Maximizar" aria-label="Maximizar"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="tb-c tb-x" id="wClose" title="Cerrar" aria-label="Cerrar"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
</header>
<i class="hazard" id="hazard"></i>

<div class="app" id="app">
  <main class="splits" id="splits"></main>

  <section class="page" id="page-alerts" hidden></section>
  <section class="page" id="page-overlays" hidden></section>
  <section class="page" id="page-settings" hidden></section>

  <aside class="activity" id="activity">
    <div class="ahead">
      <b>Actividad</b>
      <div class="actl">
        <button class="mini" id="aPause" title="Pausar las alertas">❚❚</button>
        <button class="mini" id="aSkip" title="Saltar la alerta que sale">⏭</button>
        <button class="mini" id="aTest" title="Probar una alerta">Probar ▾</button>
      </div>
    </div>
    <div class="afilter" id="aFilter"></div>
    <div class="alist" id="aList"><div class="aempty">Aquí salen los follows, subs, bits, raids, canjes de puntos… de tu directo. Con <b>↻</b> se repite la alerta.</div></div>
    <div class="astat" id="aStat"></div>
  </aside>
</div>

<button class="clipfab" id="clipFab" title="Clip rápido (Ctrl+Mayús+C)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/></svg><span>CLIP</span></button>
<div id="cards"></div>
<div class="ctx" id="ctx" hidden></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script src="shared/scopes.js"></script>
<script src="js/platform.js"></script>
<script src="shared/sounds.js"></script>
<script src="shared/alertdefs.js"></script>
<script src="js/util.js"></script>
<script src="js/emotes.js"></script>
<script src="js/irc.js"></script>
<script src="js/events.js"></script>
<script src="js/eventsub.js"></script>
<script src="js/usercard.js"></script>
<script src="js/chat.js"></script>
<script src="js/alertsui.js"></script>
<script src="js/overlaysui.js"></script>
<script src="js/settings.js"></script>
<script src="js/clip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
